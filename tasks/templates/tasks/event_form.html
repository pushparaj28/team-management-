{% extends "base.html" %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-8 px-4">
  <div class="bg-white max-w-lg w-full rounded-2xl shadow-sm border border-gray-100 p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">New company event</h1>
    <p class="text-sm text-gray-500 mb-6">Visible to every Manager and Employee on their calendar.</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="text-rose-600 text-xs mt-1">{{ field.errors }}</p>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="w-full bg-[#7a2656] hover:bg-[#5c1c40] text-white font-bold py-3 rounded-lg transition shadow-md mt-2">
        Publish event
      </button>
    </form>
  </div>
</div>
{% endblock %}
