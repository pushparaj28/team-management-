<!-- 🟢 SWAP ROLE DROPDOWN 🟢 -->
{% if request.user.is_superuser or request.session.is_original_admin %}
<div class="relative group hidden sm:block">
    <button class="flex items-center gap-2 bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg text-xs font-bold border border-indigo-200 hover:bg-indigo-100 transition-colors cursor-pointer">
        <i class="fas fa-exchange-alt"></i> 
        Swap Role: <span class="capitalize">{{ request.session.current_role|default:"Admin" }}</span>
        <i class="fas fa-chevron-down text-[10px]"></i>
    </button>
    
    <!-- Dropdown Menu -->
    <div class="absolute right-0 mt-1 w-36 bg-white rounded-xl shadow-lg border border-gray-100 hidden group-hover:block overflow-hidden z-50">
        <a href="{% url 'accounts:switch_role' 'admin' %}" class="block px-4 py-2.5 text-xs font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors border-b border-gray-50">
            <i class="fas fa-crown w-4 text-center mr-1"></i> Admin
        </a>
        <a href="{% url 'accounts:switch_role' 'manager' %}" class="block px-4 py-2.5 text-xs font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors border-b border-gray-50">
            <i class="fas fa-user-tie w-4 text-center mr-1"></i> Manager
        </a>
        <a href="{% url 'accounts:switch_role' 'employee' %}" class="block px-4 py-2.5 text-xs font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 transition-colors">
            <i class="fas fa-user w-4 text-center mr-1"></i> Employee
        </a>
    </div>
</div>
{% endif %}
