{% extends 'base.html' %}
{% load static %}

{% block title %}Add New User - Team Management{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto mt-8">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Add New User</h1>
            <p class="text-xs text-gray-500 mt-1">Create a new employee or manager profile.</p>
        </div>
        <a href="javascript:history.back()" class="text-sm font-bold text-gray-500 hover:text-gray-700 transition-colors">
            <i class="fas fa-arrow-left mr-1"></i> Go Back
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <form method="POST" class="p-8">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- First Name -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-2">First Name</label>
                    <input type="text" name="first_name" required placeholder="John" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:border-[#7a2656] focus:ring-1 focus:ring-[#7a2656] transition-all">
                </div>
                <!-- Last Name -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-2">Last Name</label>
                    <input type="text" name="last_name" placeholder="Doe" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:border-[#7a2656] focus:ring-1 focus:ring-[#7a2656] transition-all">
                </div>
                <!-- Email (Login ID) -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-2">Email Address (Login ID)</label>
                    <input type="email" name="email" required placeholder="john@company.com" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:border-[#7a2656] focus:ring-1 focus:ring-[#7a2656] transition-all">
                </div>
                <!-- Phone -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-2">Phone Number</label>
                    <input type="text" name="phone" placeholder="+91 9876543210" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:border-[#7a2656] focus:ring-1 focus:ring-[#7a2656] transition-all">
                </div>
                <!-- Temporary Password -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-2">Temporary Password</label>
                    <input type="text" name="password" required value="Pass@123" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:border-[#7a2656] focus:ring-1 focus:ring-[#7a2656] transition-all text-gray-600 bg-gray-50">
                    <p class="text-[10px] text-gray-400 mt-1">Default password provided. User can change it later.</p>
                </div>
                <!-- System Role -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-2">System Role</label>
                    <select name="role" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm outline-none focus:border-[#7a2656] focus:ring-1 focus:ring-[#7a2656] transition-all bg-white">
                        <option value="employee">Employee (Standard Access)</option>
                        <option value="manager">Manager (Team Lead Access)</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-8 flex justify-end gap-4 border-t border-gray-100 pt-6">
                <a href="javascript:history.back()" class="px-6 py-2.5 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Cancel</a>
                <button type="submit" class="bg-[#7a2656] hover:bg-[#5c1c40] text-white text-sm font-bold py-2.5 px-8 rounded-lg shadow-md transition-colors flex items-center gap-2">
                    <i class="fas fa-user-plus"></i> Create User
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
