{% extends 'base.html' %}

{% block title %}Edit Team Member{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-pink-50 to-white px-8 py-6 border-b border-gray-100">
            <h2 class="text-2xl font-extrabold text-gray-900">Edit Team Member</h2>
            <p class="text-sm text-gray-500 mt-1">Update details for @{{ member_user.username }}</p>
        </div>

        <!-- Form -->
        <form method="POST" class="px-8 py-8 space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- First Name -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">First Name</label>
                    <input type="text" name="first_name" value="{{ member_user.first_name }}" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#7a2656] focus:border-[#7a2656] transition-colors" required>
                </div>

                <!-- Last Name -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Last Name</label>
                    <input type="text" name="last_name" value="{{ member_user.last_name }}" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#7a2656] focus:border-[#7a2656] transition-colors" required>
                </div>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Email Address</label>
                <input type="email" name="email" value="{{ member_user.email }}" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#7a2656] focus:border-[#7a2656] transition-colors" required>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Phone Number -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Phone Number</label>
                    <input type="text" name="phone_number" value="{{ profile.phone_number }}" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#7a2656] focus:border-[#7a2656] transition-colors">
                </div>

                <!-- Role Selection -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Team Role</label>
                    <select name="role" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#7a2656] focus:border-[#7a2656] transition-colors bg-white">
                        <option value="admin" {% if profile.role == 'admin' %}selected{% endif %}>Admin</option>
                        <option value="manager" {% if profile.role == 'manager' %}selected{% endif %}>Manager</option>
                        <option value="employee" {% if profile.role == 'employee' %}selected{% endif %}>Employee</option>
                    </select>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-6 border-t border-gray-100 flex justify-end gap-3 mt-8">
                <a href="{% url 'accounts:team_list' %}" class="px-6 py-2.5 rounded-lg text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-lg text-sm font-bold text-white bg-[#7a2656] hover:bg-pink-800 shadow-md transition-colors">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
