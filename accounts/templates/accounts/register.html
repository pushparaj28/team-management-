{% extends 'base.html' %}

{% block title %}Register - Team Management{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-10 bg-white p-8 border border-gray-200 rounded-xl shadow-lg mb-10">
    <h2 class="text-3xl font-bold mb-6 text-center text-blue-600">Create an Account</h2>
    
    <!-- Registration Form -->
    <form method="POST" action="{% url 'accounts:register' %}">
        {% csrf_token %}
        
        <!-- Loop through all form fields -->
        <div class="space-y-4">
            {% for field in form %}
                <div>
                    <label class="block text-gray-700 font-medium mb-1">{{ field.label }}</label>
                    {{ field }}
                    
                    <!-- Field Errors (Agar user ne galat data daala) -->
                    {% if field.errors %}
                        <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
        
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-300 mt-6">
            Register
        </button>
    </form>
    
    <p class="mt-6 text-center text-sm text-gray-600">
        Already have an account? 
        <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline font-semibold">Login here</a>
    </p>
</div>
{% endblock %}
